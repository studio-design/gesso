# Configuration for `lychee`, the documentation link checker.
# Run it with `npm run docs:links`; CI runs the same file through
# `lycheeverse/lychee-action` in the "Documentation site" job.

# Verify that a `#fragment` names a heading that exists, not just that the file
# does. lychee resolves fragments the way GitHub does, and the published site
# agrees because `markdown.anchor.slugify` is overridden to match — see
# docs/.vitepress/github-slug.mjs. `anchor-only` skips `#:~:text=` directives,
# which lychee can only approximate on pages it did not render.
include_fragments = "anchor-only"

# `403` is here because Cloudflare and similar front ends answer a HEAD from a
# CI runner with it; `206` because a few hosts answer ranged requests that way.
accept = ["200", "206", "403"]

max_retries = 3
retry_wait_time = 2

exclude = [
  # Development-only hosts.
  '^http://localhost',
  # Run URLs cited as evidence in docs; they expire and are not navigation.
  '^https://github\.com/studio-design/gesso/actions/runs/',
  # Directory listings GitHub answers with 404 until the branch is pushed.
  '^https://github\.com/studio-design/gesso/tree/main/examples/(core|laravel|symfony)$',
  # The published site itself: checking it from a PR asserts the *previous*
  # deploy, which says nothing about the branch under test.
  '^https://studio-design\.github\.io/gesso/',
  # Badge and metadata services that rate-limit unauthenticated CI traffic.
  '^https://packages\.tools/',
  '^https://poser\.pugx\.org/',
]
